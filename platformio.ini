; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = ddp_neopixelbus
          
[env]
monitor_speed = 57600
monitor_echo = yes
build_type = release

[env:adalight_fastled]
extends = env:pro16MHzatmega328
monitor_speed = 115200
build_src_filter = +<*.cpp> 
                   +<../examples/adalight/*>
build_flags = -DAMBL_FASTLED
              -DAMBL_DEBUG_LED              
              -DAMBL_LEDS_PIN=12
              -DAMBL_LEDS_TYPE=WS2812B
              -DAMBL_LEDS_COUNT=250
              -DDBG_TO_SERIAL
lib_deps = fastled/FastLED


[env:adalight_neopixelbus]
extends = env:uno
monitor_speed = 115200
build_src_filter = +<*.cpp> 
                   +<../examples/adalight/*>
build_flags = -DAMBL_DEBUG_LED
              -DAMBL_NEOPIXEL_BUS          
              -DAMBL_LEDS_PIN=6
              -DAMBL_LEDS_TYPE=NeoWs2812xMethod
              -DAMBL_LEDS_COUNT=250
lib_deps =  makuna/NeoPixelBus


;examples/ddp - low level DDP receiver over WiFi (ESP8266 d1_mini, GPIO2)
;Recommended: NeoPixelBus UART1 method on GPIO2 - it does not block WiFi
;during Show(), so streamed packets are not dropped.
[env:ddp_neopixelbus]
extends = env:esp8266
#board = d1_mini
monitor_speed = 57600
upload_speed = 921600
build_src_filter = +<*.cpp>
                   +<../examples/ddp/*>
build_flags = ${env:esp8266.build_flags}
              -DAMBL_NEOPIXEL_BUS
              -DAMBL_LEDS_PIN=2
              -DAMBL_LEDS_TYPE=NeoEsp8266Uart1Ws2812xMethod
              -DAMBL_LEDS_COUNT=250
              -DAMBL_COLOR_ORDER=NeoGrbFeature
              #-DAMBL_DEBUG_LED
              -DDBG_TO_SERIAL 
lib_deps = makuna/NeoPixelBus

;examples/ddp - FastLED variant (bit-bangs the strip; disables interrupts
;during show, which can drop the occasional WiFi packet on ESP8266).
[env:ddp_fastled]
extends = env:esp8266
board = d1_mini
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*.cpp>
                   +<../examples/ddp/*>
build_flags = ${env:esp8266.build_flags}
              -DAMBL_FASTLED
              -DAMBL_LEDS_PIN=2
              -DAMBL_LEDS_TYPE=WS2812B
              -DAMBL_LEDS_COUNT=250
              -DAMBL_COLOR_ORDER=GRB
              -DAMBL_DEBUG_LED
lib_deps = fastled/FastLED


;examples/serialbinary
[env:serialbinary]
extends = env:uno
build_flags = -DDBG_TO_SERIAL -DESPHOME_CTRL
build_src_filter = +<*.cpp> 
                   +<../examples/serialbinary/*>
monitor_filters = tx_hex, send_on_enter
monitor_echo    = yes                  
monitor_encoding  = Latin1               

;examples/general
[env:general]
extends = env:uno
build_flags = -DUSE_IR_REMOTE -DDBG_TO_SERIAL -DESPHOME_CTRL
build_src_filter = +<*.cpp> 
                   +<../examples/general/*>
lib_deps = fastled/FastLED@>=3.4.0                   
           z3t0/IRremote
           
                   

;examples/eeprom
[env:eeprom]
extends = env:nano_every
build_src_filter = +<*.cpp> 
                   +<../examples/eeprom/*>

;examples/eeprom
[env:webserver]
extends = env:esp01_1m
build_src_filter = +<*.cpp> 
                   +<../examples/webserver/*>                   
;targets = uploadfs                   

;examples/json
[env:json]
extends = env:esp01_1m
build_src_filter = +<*.cpp> 
                   +<../examples/json/*>


;Hardware boards

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_speed = 115200
build_flags = 
  ;-DDBG_TO_SERIAL 
  ;-DDBG_TO_SW_SERIAL


[env:pro16MHzatmega328]
platform = atmelavr
board = pro16MHzatmega328 
framework = arduino
upload_speed = 57600


[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
upload_speed = 115200


[env:promicro_5v]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
monitor_speed = 115200
upload_speed = 115200


[env:nano_every]
platform  = atmelmegaavr
board     = nano_every
framework = arduino
monitor_speed = 57600
upload_speed = 115200


;Generic esp8266
[env:esp8266]
upload_speed = 115200
platform = espressif8266  
board = esp01_1m                  
framework = arduino
platform_packages = toolchain-xtensa                   
                    platformio/tool-esptool @ ~1.413.0
                    platformio/tool-esptoolpy @ ~1.30000.0
board_build.filesystem = littlefs
build_flags = 
  -DDBG_TO_SERIAL
  -Wno-register
  -Wno-deprecated-declarations
  -Wno-misleading-indentation
upload_protocol = esptool   


;Generic esp32
[env:esp32]
upload_speed = 115200
framework = arduino
platform = espressif32
board = esp32dev
platform_packages = framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git
build_flags = 
  -Wno-register
  -Wno-deprecated-declarations
  -Wno-misleading-indentation


[env:esp01_1m]
extends = env:esp8266
board   = esp01_1m

  



                  





